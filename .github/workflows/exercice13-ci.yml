name: CI Exercice 13

on:
  push:
    paths:
      - '03_exercices/exercice13/**'
      - '.github/workflows/exercice13-ci.yml'
  pull_request:
    paths:
      - '03_exercices/exercice13/**'
      - '.github/workflows/exercice13-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: 03_exercices/exercice13

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du projet
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 03_exercices/exercice13/pom.xml

      - name: Execution des tests et generation des rapports
        run: mvn verify -B

      - name: Archivage des artefacts de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercice13-test-reports
          path: |
            03_exercices/exercice13/target/surefire-reports
            03_exercices/exercice13/target/site/jacoco
            03_exercices/exercice13/target/cucumber-reports
